<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Игровая мастерская</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🕹️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root {
  --bg:#ECEAF6; --ink:#1A1740; --muted:#5B5882; --panel:#FFFFFF; --line:#CFCBE8;
  --accent:#3B3BFF; --sun:#FFC93C; --sun-ink:#1A1740; --bezel:#1A1740; --screen:#0F0D2B; --err:#B3261E;
  --pixel:"Press Start 2P", "Courier New", monospace;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#12112B; --ink:#ECEAF6; --muted:#A5A2CC; --panel:#1D1B40; --line:#34316A; --accent:#8C8CFF; --bezel:#2A2760; --err:#FFB4AB; }
}
:root[data-theme="dark"] { --bg:#12112B; --ink:#ECEAF6; --muted:#A5A2CC; --panel:#1D1B40; --line:#34316A; --accent:#8C8CFF; --bezel:#2A2760; --err:#FFB4AB; }
html { scroll-padding-top:env(safe-area-inset-top,0px); }
*, *::before, *::after { box-sizing:inherit; }
body { margin:0; background:var(--bg); color:var(--ink); font:500 16px/1.5 var(--body); }
main { max-width:560px; margin:0 auto; padding:20px 16px 32px; }
h1 { font:400 17px/1.5 var(--pixel); margin:4px 0 8px; }
.lead { margin:0 0 18px; color:var(--muted); max-width:44ch; }
.screen { position:relative; background:var(--bezel); padding:12px; border-radius:18px; }
.glass { position:relative; background:var(--screen); border-radius:8px; overflow:hidden; aspect-ratio:3/4; max-height:68vh; width:100%; margin:0 auto; }
iframe[hidden] { display:none; }
iframe { display:block; width:100%; height:100%; border:0; background:#000; }
.cover { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px; color:#ECEAF6; background:var(--screen); }
.cover[hidden] { display:none; }
.cover b { font:400 13px/1.8 var(--pixel); }
.cover span { font-size:14px; color:#A5A2CC; max-width:30ch; }
.block { width:22px; height:22px; background:var(--sun); animation:blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity:0; } }
@media (prefers-reduced-motion: reduce) { .block { animation:none; } }
.make { margin-top:18px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
label { display:block; font-weight:800; margin-bottom:6px; }
textarea, input { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:2px solid var(--line); border-radius:10px; padding:10px 12px; }
textarea { resize:vertical; min-height:84px; }
textarea:focus-visible, input:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px; }
.chip { font:inherit; font-size:14px; color:var(--ink); background:transparent; border:2px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer; }
.chip:hover { border-color:var(--accent); }
.row { display:flex; gap:10px; flex-wrap:wrap; }
.btn { font:800 16px var(--body); border:0; border-radius:10px; padding:12px 18px; cursor:pointer; flex:1 1 150px; }
.btn.main { background:var(--sun); color:var(--sun-ink); }
.btn.alt { background:var(--accent); color:#fff; }
:root[data-theme="dark"] .btn.alt { color:#12112B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.alt { color:#12112B; } }
.btn.ghost { background:transparent; color:var(--ink); border:2px solid var(--line); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
#keybox { margin-top:14px; }
#keybox small, .note { color:var(--muted); font-size:13px; display:block; margin-top:6px; }
#msg { min-height:1.5em; margin:12px 0 0; font-weight:700; }
#msg.err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>Игровая мастерская</h1>
  <p class="lead">Опиши игру словами. ИИ напишет её целиком и сразу запустит на экране.</p>

  <section class="screen" aria-label="Экран игры">
    <div class="glass">
      <iframe id="game" sandbox="allow-scripts" title="Созданная игра" hidden></iframe>
      <div class="cover" id="empty"><b>НАЖМИ<br>СОЗДАТЬ</b><span>Игра появится здесь и будет играбельной сразу.</span></div>
      <div class="cover" id="busy" hidden><div class="block"></div><b>ПИШУ КОД</b><span id="timer">0 с</span></div>
    </div>
  </section>

  <section class="make">
    <label for="idea">Идея игры</label>
    <textarea id="idea" placeholder="Змейка, которая ест яблоки и становится длиннее"></textarea>
    <div class="chips" aria-label="Примеры идей">
      <button class="chip" type="button">Змейка ест яблоки и растёт</button>
      <button class="chip" type="button">Космический шутер с волнами врагов</button>
      <button class="chip" type="button">Платформер: прыгай и собирай монеты</button>
    </div>
    <div class="row">
      <button class="btn main" id="create" type="button">Создать игру</button>
      <button class="btn alt" id="tweak" type="button" disabled>Изменить эту игру</button>
      <button class="btn ghost" id="save" type="button" disabled>Скачать .html</button>
    </div>
    <div id="keybox">
      <label for="key">API-ключ Anthropic</label>
      <input id="key" type="password" autocomplete="off" placeholder="sk-ant-…">
      <small>Ключ хранится только в этом браузере и уходит только в Anthropic.</small>
    </div>
    <p id="msg" role="status"></p>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let current = '', working = false, tick = null;

const SYSTEM = `Ты генератор мини-игр. Пользователь описывает игру, ты пишешь её целиком.
Верни ТОЛЬКО один полный самодостаточный HTML-файл, начиная с <!DOCTYPE html>, без markdown и без пояснений.
Требования: один файл с HTML, CSS и JS; никаких внешних ресурсов, библиотек и localStorage; игра работает на телефоне (касания, свайпы или экранные кнопки) и на компьютере (клавиатура); холст подстраивается под ширину экрана; есть счёт, конец игры и кнопка «Играть снова»; яркий аккуратный вид; тексты на языке пользователя; код без ошибок и сразу играбельный.`;

/*AI_START*/
const MODEL = 'claude-sonnet-5-5';
const AI = {
  needsKey: true,
  getKey() { try { return localStorage.getItem('anthropic_key') || ''; } catch (e) { return ''; } },
  setKey(v) { try { localStorage.setItem('anthropic_key', v); } catch (e) {} },
  async ask(system, user) {
    const key = AI.getKey();
    if (!key) throw new Error('Вставь свой API-ключ Anthropic в поле ниже.');
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: MODEL, max_tokens: 12000, system, messages: [{ role: 'user', content: user }] })
    });
    const d = await r.json();
    if (!r.ok) throw new Error((d.error && d.error.message) || 'Ошибка API ' + r.status);
    return d.content.filter(b => b.type === 'text').map(b => b.text).join('');
  },
  async save(name, html) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
};
/*AI_END*/

function extract(text) {
  const t = text.replace(/```(?:html)?/gi, '');
  const i = t.search(/<!doctype html|<html/i);
  if (i < 0) return '';
  const j = t.lastIndexOf('</html>');
  return j > i ? t.slice(i, j + 7) : t.slice(i);
}
function say(text, isErr) { const m = $('#msg'); m.textContent = text || ''; m.className = isErr ? 'err' : ''; }
function setBusy(on) {
  working = on;
  $('#busy').hidden = !on;
  ['#create', '#tweak', '#save'].forEach(s => { $(s).disabled = on || (s !== '#create' && !current); });
  clearInterval(tick);
  if (on) { const t0 = Date.now(); $('#timer').textContent = '0 с'; tick = setInterval(() => { $('#timer').textContent = Math.round((Date.now() - t0) / 1000) + ' с'; }, 1000); }
}

async function run(mode) {
  if (working) return;
  const idea = $('#idea').value.trim();
  if (!idea) return say('Опиши игру или выбери пример ниже.', true);
  say(''); setBusy(true);
  try {
    const user = mode === 'tweak'
      ? 'Текущая игра:\n' + current + '\n\nЧто изменить: ' + idea + '\n\nВерни полный обновлённый HTML-файл.'
      : 'Идея игры: ' + idea;
    const html = extract(await AI.ask(SYSTEM, user));
    if (!html) throw new Error('ИИ вернул не игру. Попробуй описать идею иначе.');
    current = html;
    $('#game').srcdoc = html; $('#game').hidden = false; $('#empty').hidden = true;
    $('#idea').value = '';
    setBusy(false);
    say('Готово! Чтобы поменять игру, опиши правку и нажми «Изменить эту игру».');
  } catch (e) {
    setBusy(false);
    say((e && e.message) || 'Не получилось. Попробуй ещё раз.', true);
  }
}

$('#create').onclick = () => run('new');
$('#tweak').onclick = () => run('tweak');
$('#save').onclick = async () => {
  try { await AI.save('moya-igra.html', current); } catch (e) { say((e && e.message) || 'Не удалось сохранить файл.', true); }
};
document.querySelectorAll('.chip').forEach(c => c.onclick = () => { $('#idea').value = c.textContent; $('#idea').focus(); });
if (AI.needsKey) { $('#key').value = AI.getKey(); $('#key').onchange = e => AI.setKey(e.target.value.trim()); }
else { $('#keybox').hidden = true; }
</script>
</body>
</html>
